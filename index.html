<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>모아먹자 - 같이 시키면 더 맛있으니까</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#" data-page="discover" aria-label="모아먹자 홈">
          <span class="brand-mark">모</span>
          <span>모아먹자<span class="brand-period">.</span></span>
        </a>
        <div class="side-label">MENU</div>
        <nav class="side-nav" aria-label="메인 메뉴">
          <button class="nav-item active" data-page="discover"><span class="nav-icon">⌕</span>모집글 찾기</button>
          <button class="nav-item" data-page="create"><span class="nav-icon">＋</span>모집글 만들기</button>
          <button class="nav-item" data-page="applicants"><span class="nav-icon">♧</span>신청자 관리</button>
          <button class="nav-item" data-page="chat"><span class="nav-icon">▤</span>공동 채팅방<span class="nav-badge">2</span></button>
          <button class="nav-item" data-page="payment"><span class="nav-icon">₩</span>입금 현황</button>
          <button class="nav-item" data-page="delivery"><span class="nav-icon">◷</span>진행 상황</button>
          <button class="nav-item" data-page="profile"><span class="nav-icon">◉</span>내 프로필</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="help-card">
            <span class="help-icon">✳</span>
            <strong>처음이신가요?</strong>
            <span>모아먹자 이용 방법을<br />확인해 보세요.</span>
            <button id="helpButton">이용 가이드 보기 <span>↗</span></button>
          </div>
          <button class="user-mini" data-page="profile">
            <span class="avatar avatar-me" id="sidebarAvatar">서</span>
            <span class="user-mini-copy"><strong id="sidebarUserName">게스트</strong><small id="sidebarUserDetail">로그인이 필요해요</small></span>
            <span class="more">···</span>
          </button>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="mobile-brand"><span class="brand-mark">모</span> 모아먹자<span class="brand-period">.</span></div>
          <div class="location-pill"><span class="pin">⌖</span><span>서울시 마포구 <strong>연남동</strong></span><span class="chevron">⌄</span></div>
          <div class="topbar-right">
            <button class="icon-button notification" aria-label="알림">♧<i></i></button>
            <button class="text-button" id="authButton" data-action="auth-open">로그인</button>
            <button class="top-profile" id="topProfileButton" data-page="profile"><span class="avatar avatar-me" id="topProfileAvatar">게</span><span id="topProfileName">게스트</span><span class="chevron">⌄</span></button>
          </div>
        </header>

        <div class="page-content" id="pageContent"></div>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close" id="modalClose" aria-label="닫기">×</button>
        <div id="modalContent"></div>
      </section>
    </div>
    <script defer src="https://js.tosspayments.com/v1/payment"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="app.js"></script>
  </body>
</html>
