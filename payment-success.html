<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>가상계좌 발급 확인 - 모아먹자</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
      main { width: min(460px, 100%); text-align: center; }
      .account-number { overflow-wrap: anywhere; font-size: 21px; font-weight: 800; margin: 16px 0; color: #20232b; }
      #message { white-space: pre-line; }
      .primary-button { display: inline-block; margin-top: 16px; }
      .page-card { padding: 30px; }
    </style>
  </head>
  <body>
    <main class="page-card">
      <div class="brand-mark" style="margin:0 auto 15px">모</div>
      <div class="eyebrow">TOSS VIRTUAL ACCOUNT</div>
      <h1 id="title">가상계좌 발급을 확인하고 있어요</h1>
      <p class="subheading" id="message">토스페이먼츠에 결제 정보를 확인합니다.</p>
      <div id="account" hidden></div>
      <a class="primary-button" href="/?page=payment">입금 현황으로 돌아가기</a>
    </main>
    <script>
      const title = document.querySelector("#title");
      const message = document.querySelector("#message");
      const accountView = document.querySelector("#account");
      const params = new URLSearchParams(location.search);
      const details = {
        paymentKey: params.get("paymentKey"),
        orderId: params.get("orderId"),
        amount: Number(params.get("amount"))
      };

      async function confirmAccount() {
        if (!details.paymentKey || !details.orderId || !Number.isSafeInteger(details.amount)) {
          throw new Error("토스 결제 확인 정보가 올바르지 않습니다.");
        }
        const response = await fetch("/api/confirm-virtual-account", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(details)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "가상계좌 발급 확인에 실패했습니다.");

        title.textContent = "가상계좌가 발급됐어요";
        message.textContent = "표시된 금액을 입금해 주세요. 입금은 웹훅으로 자동 확인됩니다.";
        accountView.hidden = false;
        accountView.className = "issued-account-card";
        const bankNames = { "06": "KB국민은행", "11": "NH농협은행", "20": "우리은행", "81": "하나은행", "88": "신한은행" };
        const account = result.account;
        const bank = document.createElement("strong");
        bank.textContent = bankNames[account.bankCode] || "가상계좌";
        const number = document.createElement("div");
        number.className = "account-number";
        number.textContent = account.accountNumber || "계좌번호를 확인하지 못했습니다.";
        const amount = document.createElement("span");
        amount.textContent = `입금 금액: ${Number(account.amount).toLocaleString("ko-KR")}원`;
        const dueDate = document.createElement("span");
        dueDate.textContent = `입금 기한: ${account.dueDate || "토스페이먼츠 안내 시간"}`;
        accountView.append(bank, number, amount, dueDate);
      }

      confirmAccount().catch((error) => {
        title.textContent = "계좌 발급을 확인하지 못했어요";
        message.textContent = error.message;
      });
    </script>
  </body>
</html>
